<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buscaminas</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/dseg7-classic@5.3.0/index.css">
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <!-- <h1 class="titulo">Buscaminas - Neon</h1> -->
  <div class="barra-superior">
    <div class="barra-items">
      <div class="barra-grupo grupo-izquierdo">
        <img src="../../assets/img/GRAYFLAG.png" alt="Bandera" class="bomba-icon">
        <div class="item-control bomba-box">
          <div class="display mini-display">
            <span class="ghost">999</span>
            <span id="bombas-restantes" class="live">000</span>
          </div>
        </div>
      </div>

      <div class="barra-grupo grupo-centro">
        <button id="reiniciar" type="button" aria-label="Reiniciar partida"></button>
      </div>

      <div class="barra-grupo grupo-derecho">
        <div class="item-control tiempo-box">
          <div class="display mini-display">
            <span class="ghost">999</span>
            <span id="tiempo" class="live">000</span>
          </div>
        </div>
        <img src="../../assets/img/GRAYCLOCK.png" alt="Reloj" class="bomba-icon">
      </div>
    </div>
  </div>

  <div class="contenedor-principal">
    <!-- Esto cambiar algun dia se ve horrible -->
    <div class="tablero"></div>
    <aside class="panel-estadisticas">
      <h2>Resultados</h2>
      <ul>
        <li>Clicks Izq: <span id="estad-clicks-izq">0</span></li>
        <li>Clicks Der: <span id="estad-clicks-der">0</span></li>
        <li>Tiempo transcurrido: <span id="estad-tiempo">0.000 s</span></li>
        <li>Fecha última partida: <span id="estad-fecha">-</span></li>
        <li>Dificultad: <span id="estad-modo">1</span></li>
        <li>XP ganada: <span id="estad-exp">0</span></li>
      </ul>
    </aside>
  </div>

  <script src="plantilla.js"></script>
  <script src="../api.js"></script>
  <script src="logica.js"></script>
  <script src="juego.js"></script>
  <script src="stats.js"></script>
  <script src="click.js"></script>



</body>

</html>
